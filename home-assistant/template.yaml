# Home Assistant Template Entities for 2Park API
# Add to configuration.yaml as:
#   template: !include template.yaml
#
# The template integration expects a list of entity definitions.

- sensor:
    # --- Helper: formatted booking summary ---
    # Combines balance + bookings into a human-readable string
    # that any card can display.
    - name: "2Park Summary"
      state: >
        {% set count_str = states('sensor.twopark_bookings_count') %}
        {% set balance_str = states('sensor.twopark_balance') %}
        {% set count = count_str | int if count_str not in ['unknown', 'unavailable', 'none', ''] else 0 %}
        {% set balance = balance_str | float if balance_str not in ['unknown', 'unavailable', 'none', ''] else 0 %}
        {% if count == 0 %}
          No active bookings · Balance: €{{ '%.2f'|format(balance) }}
        {% else %}
          {{ count }} active booking(s) · Balance: €{{ '%.2f'|format(balance) }}
        {% endif %}
      attributes:
        balance: "{{ states('sensor.twopark_balance') }}"
        currency: "{{ state_attr('sensor.twopark_balance', 'currency') }}"
        last_checked: "{{ state_attr('sensor.twopark_balance', 'last_checked') }}"
        booking_count: "{{ states('sensor.twopark_bookings_count') }}"
        bookings: "{{ state_attr('sensor.twopark_bookings_count', 'bookings') | default('[]') }}"
