# ============================================================
# Home Assistant — 2Park Dashboard (Improved Native)
# ============================================================
#
# To use:
#   1. In your HA dashboard → Edit → Three dots → Edit as YAML
#   2. Replace the card content with the YAML below
#   3. Duplicate the "BOOKING" sections for additional bookings
#   4. Replace "51PXPN" with your actual license plate(s)
#
# ============================================================

type: vertical-stack
cards:
  # ── ROW 1: Balance + Booking Count ───────────────────────
  - type: horizontal-stack
    cards:
      - type: entities
        title: "Balance"
        show_header_toggle: false
        entities:
          - entity: sensor.2park_balance
            name: " "
            icon: mdi:wallet

      - type: entities
        title: "Bookings"
        show_header_toggle: false
        entities:
          - entity: sensor.2park_bookings_count
            name: " "
            icon: mdi:parking

  # ── ROW 2: Booking 51PXPN ────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: button
        name: "51PXPN"
        icon: mdi:car
        tap_action:
          action: call-service
          service: rest_command.cancel_twopark_booking
          data:
            license_plate: "51PXPN"
        confirmation:
          text: "Cancel booking for 51PXPN?"
        show_state: false

      - type: button
        name: "+60m"
        icon: mdi:arrow-up-bold
        tap_action:
          action: call-service
          service: rest_command.extend_twopark_booking
          data:
            license_plate: "51PXPN"
            additional_minutes: 60
        confirmation:
          text: "Extend 51PXPN by 60 minutes?"

