# ============================================================
# Home Assistant — 2Park Dashboard (Improved Native)
# ============================================================
#
# This uses ONLY built-in Home Assistant cards.
# No HACS or custom cards required.
#
# This card is DYNAMIC: it reads active bookings from the
# sensor.2park_bookings_dynamic sensor attributes and shows
# cancel/extend buttons only for bookings that actually exist.
#
# Prerequisites:
#   - sensors.yaml      (REST sensors for balance & bookings)
#   - template.yaml     (template sensors, including the
#                        "2Park Bookings Dynamic" sensor)
#   - rest_commands.yaml (cancel & extend REST commands)
#
# How to use:
#   1. In your HA dashboard → Edit → Three dots → Edit as YAML
#   2. Replace the card content with the YAML below
#   3. No need to edit for individual bookings — it works
#      automatically based on the current bookings from the API.
#
# How it works:
#   The template sensor "sensor.2park_bookings_dynamic" parses
#   the bookings JSON array from the API and exposes each
#   booking's license_plate, start_time, end_time, and status
#   as individual attributes (booking_1_plate, etc.).
#
#   Each booking row in this card uses HA's "state" condition
#   to only show when the corresponding booking attribute is
#   non-empty. The cancel/extend buttons use Jinja2 templates
#   to read the plate from the sensor attributes.
#
# Limitations:
#   - Supports up to 5 concurrent bookings (rows 1-5).
#     If you regularly have more, duplicate row patterns
#     and extend the template sensor.
#   - The REST sensors update every 5 minutes (configurable
#     in sensors.yaml). New bookings appear after the next
#     scan. Use "homeassistant.update_entity" to force refresh.
# ============================================================

type: vertical-stack
cards:
  # ── HEADER: Balance + Booking Count ───────────────────────
  - type: horizontal-stack
    cards:
      - type: entities
        title: "€{{ states('sensor.2park_balance') }}"
        show_header_toggle: false
        entities:
          - entity: sensor.2park_balance
            name: Balance
            icon: mdi:cash
      - type: entities
        title: "{{ states('sensor.2park_bookings_count') | int(0) }} active"
        show_header_toggle: false
        entities:
          - entity: sensor.2park_bookings_count
            name: Bookings
            icon: mdi:parking

  # ── BOOKING TABLE ─────────────────────────────────────────
  # Each row conditionally appears only when that booking slot
  # has a license plate (non-empty). Rows are hidden when empty.
  # Supports up to 5 concurrent bookings.

  # ── BOOKING 1 ─────────────────────────────────────────────
  - type: conditional
    conditions:
      - entity: sensor.2park_bookings_dynamic
        attribute: booking_1_plate
        state_not: ""
    card:
      type: horizontal-stack
      cards:
        - type: entities
          title: "Booking 1"
          show_header_toggle: false
          entities:
            - entity: sensor.2park_bookings_dynamic
              name: "{{ state_attr('sensor.2park_bookings_dynamic', 'booking_1_plate') }}"
              icon: mdi:car
              secondary_info: >
                Until {{ as_timestamp(state_attr('sensor.2park_bookings_dynamic', 'booking_1_end')) | timestamp_custom('%H:%M', true) }}
        - type: button
          name: Cancel
          icon: mdi:cancel
          tap_action:
            action: call-service
            service: rest_command.cancel_twopark_booking
            data:
              license_plate: "{{ state_attr('sensor.2park_bookings_dynamic', 'booking_1_plate') }}"
            confirmation:
              text: "Cancel booking for {{ state_attr('sensor.2park_bookings_dynamic', 'booking_1_plate') }}?"
        - type: button
          name: +60m
          icon: mdi:arrow-up-bold
          tap_action:
            action: call-service
            service: rest_command.extend_twopark_booking
            data:
              license_plate: "{{ state_attr('sensor.2park_bookings_dynamic', 'booking_1_plate') }}"
              additional_minutes: 60
            confirmation:
              text: "Extend {{ state_attr('sensor.2park_bookings_dynamic', 'booking_1_plate') }} by 60 minutes?"

