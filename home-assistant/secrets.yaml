# Add to your Home Assistant secrets.yaml
# Location: /config/secrets.yaml
#
# NOTE: The "Bearer " prefix is required by the 2Park API
twopark_api_token: "Bearer YOURTOKEN"

# 2Park API server address
# If the hostname rasp-pi-4-service.local doesn't resolve from HA,
# replace it with the server's IP address, e.g.: http://192.168.1.100:8090
twopark_api_host: "http://rasp-pi-4-service.local:8090"
