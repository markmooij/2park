# Home Assistant REST Commands for 2Park API
# Add to rest_commands.yaml or inside a rest_command: block in configuration.yaml
#
# Usage from automations or UI actions:
#
# Cancel booking:
#   service: rest_command.cancel_twopark_booking
#   data:
#     license_plate: "51PXPN"
#
# Extend booking by 60 minutes:
#   service: rest_command.extend_twopark_booking
#   data:
#     license_plate: "51PXPN"
#     additional_minutes: 60
#
# Each API call launches a headless browser that takes 5-25 seconds.
# The timeout of 120s accounts for worst-case scenarios.

cancel_twopark_booking:
  url: !secret twopark_api_host/api/bookings/{{ license_plate }}/cancel
  method: POST
  headers:
    Authorization: !secret twopark_api_token
    Content-Type: application/json
  timeout: 120

extend_twopark_booking:
  url: !secret twopark_api_host/api/bookings/{{ license_plate }}/extend
  method: POST
  headers:
    Authorization: !secret twopark_api_token
    Content-Type: application/json
  payload: '{"additional_minutes": {{ additional_minutes }}}'
  timeout: 120

create_twopark_booking:
  url: !secret twopark_api_host/api/bookings
  method: POST
  headers:
    Authorization: !secret twopark_api_token
    Content-Type: application/json
  payload: '{"license_plate": "{{ license_plate }}", "start_time": "now", "duration_minutes": {{ duration_minutes }}}'
  timeout: 120
