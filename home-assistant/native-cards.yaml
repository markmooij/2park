# ============================================================
# Home Assistant — 2Park Dashboard (Native Cards Version)
# ============================================================
#
# This version uses ONLY built-in Home Assistant cards.
# No HACS or custom cards required.
#
# ⚠️ RECOMMENDED: Use native-cards-improved.yaml instead.
#   That version is DYNAMIC — it reads active bookings from the
#   sensor.2park_bookings_dynamic sensor attributes and shows
#   cancel/extend buttons for each booking automatically,
#   without hardcoding license plates.
#
#   This file is kept as a fallback reference for the simpler
#   static card layout (no action buttons).
#
# ============================================================
# SIMPLE ENTITY CARD — Shows balance and booking count
# ============================================================
#
# type: entities
# title: 2Park
# show_header_toggle: false
# entities:
#   - sensor.2park_balance
#   - sensor.2park_bookings_count
#   - sensor.2park_summary
#
# ============================================================
# STATIC BUTTON CARDS — Cancel & Extend (hardcoded plates)
# ============================================================
#
# Add these as separate "Button" cards in your dashboard.
# You'll need one set per booking (manually add each).
# These use hardcoded plates — for dynamic plates, use the
# improved version instead.
#
# CANCEL BUTTON EXAMPLE:
# type: button
# name: Cancel 51PXPN
# icon: mdi:cancel
# tap_action:
#   action: call-service
#   service: rest_command.cancel_twopark_booking
#   data:
#     license_plate: "51PXPN"
#   confirmation:
#     text: Cancel booking for 51PXPN?
#
# EXTEND BUTTON EXAMPLE:
# type: button
# name: Extend 51PXPN +60min
# icon: mdi:arrow-up-bold
# tap_action:
#   action: call-service
#   service: rest_command.extend_twopark_booking
#   data:
#     license_plate: "51PXPN"
#     additional_minutes: 60
#   confirmation:
#     text: Extend 51PXPN by 60 minutes?
#
# ============================================================
# COMPLETE NATIVE DASHBOARD (copy into YAML mode)
# ============================================================
#
# This is a simplified version with balance + booking count
# only. For action buttons, use native-cards-improved.yaml.

type: vertical-stack
cards:
  # Balance card
  - type: entities
    title: "2Park — Balance"
    show_header_toggle: false
    entities:
      - entity: sensor.2park_balance
        name: Balance
        icon: mdi:wallet
      - entity: sensor.2park_summary
        name: Summary
        icon: mdi:information-outline

  # Booking count
  - type: entities
    title: "2Park — Active Bookings"
    show_header_toggle: false
    entities:
      - entity: sensor.2park_bookings_count
        name: Active Bookings
        icon: mdi:parking

# ============================================================
# NOTES
# ============================================================
#
# For a fully dynamic setup (auto-detecting booking plates
# with cancel/extend buttons), use native-cards-improved.yaml
#
# ENTITY IDs:
#   sensor.2park_balance              — Current balance in EUR
#   sensor.2park_bookings_count       — Number of active bookings
#   sensor.2park_bookings_dynamic     — Dynamic booking attributes
#   sensor.2park_summary              — Formatted summary text
# ============================================================
