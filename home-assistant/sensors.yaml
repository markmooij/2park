# Home Assistant REST Sensors for 2Park API
# Add to sensors.yaml or inside a sensors: block in configuration.yaml
#
# Prerequisites:
#   1. Add secrets.yaml with twopark_api_token and twopark_api_host
#   2. No additional HA integrations needed (rest is built-in)

# --- Account Balance ---
- platform: rest
  name: "2Park Balance"
  resource: !secret twopark_api_host/api/account/balance
  method: GET
  headers:
    Authorization: !secret twopark_api_token
    Content-Type: application/json
  value_template: "{{ value_json.balance | default(0) }}"
  unit_of_measurement: "EUR"
  json_attributes:
    - currency
    - last_checked
  scan_interval: 300 # 5 min — balance doesn't change often
  timeout: 60

# --- Active Bookings Count ---
- platform: rest
  name: "2Park Bookings Count"
  resource: !secret twopark_api_host/api/bookings
  method: GET
  headers:
    Authorization: !secret twopark_api_token
    Content-Type: application/json
  value_template: "{{ value_json.count | default(0) }}"
  json_attributes:
    - bookings
  scan_interval: 300 # 5 min
  timeout: 60
